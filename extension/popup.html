<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Send to Katevazo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icon.png" alt="" width="28" height="28">
    <div>
      <h1>Katevazo</h1>
      <p class="status" id="status" aria-live="polite">Checking for the app…</p>
    </div>
  </header>

  <section class="page" id="page" hidden>
    <p class="kind">Current page</p>
    <p class="title" id="title">&nbsp;</p>
    <p class="host" id="host"></p>
  </section>

  <button class="primary" id="send" type="button" hidden>Send to Katevazo</button>

  <section class="note" id="missing" hidden>
    <p><strong>Katevazo isn't installed.</strong> Get the app, or update it to the latest version if you already have it, then open this popup again.</p>
    <a class="primary" href="https://github.com/ipuppyyt/katevazo/releases/latest" target="_blank" rel="noopener">Get Katevazo</a>
  </section>

  <script src="popup.js"></script>
</body>
</html>
