<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161617" media="(prefers-color-scheme: dark)" />
    <meta name="author" content="Katevazo" />
    <link rel="icon" type="image/svg+xml" href="/katevazo/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/katevazo/favicon-32.png" />
    <link rel="apple-touch-icon" href="/katevazo/apple-touch-icon.png" />
    <link rel="manifest" href="/katevazo/manifest.webmanifest" />
    <link rel="preconnect" href="https://api.github.com" crossorigin />
    <!--seo:start-->
    <title>Katevazo: free video downloader</title>
    <meta name="description" content="Katevazo is a free, open-source video downloader for Windows, macOS and Linux." />
    <!--seo:end-->
    <script>
      // Apply a saved theme before first paint; with none saved the system theme applies.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
