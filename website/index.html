<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Katevazo: a clean, fast video downloader</title>
    <meta name="description" content="Katevazo is a clean, fast, cross-platform video downloader for Windows, macOS and Linux, with a browser extension for Chrome and Edge." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/katevazo/logo.svg" />
      <script>
      // Apply a saved theme before first paint; with none saved the system theme applies.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body data-page="home">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
