[package]
name = "katevazo"
version = "0.5.0"
description = "Katevazo - a clean, cross-platform video downloader"
authors = ["Katevazo contributors"]
license = "MIT"
repository = "https://github.com/ipuppyyt/katevazo"
homepage = "https://github.com/ipuppyyt/katevazo"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "katevazo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tauri-plugin-clipboard-manager = { version = "2.5.0", default-features = false }
tauri-plugin-notification = "2.8.0"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
url = "2"
tauri-plugin-global-shortcut = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
