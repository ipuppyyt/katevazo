<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- katevazo app icon: a κ (kappa, from Greek "κατέβασε" = "download") whose lower leg
       becomes a downward arrow, set on a deep indigo-to-blue squircle. -->
  <defs>
    <linearGradient id="bg" x1="140" y1="0" x2="884" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B7CFF"/>
      <stop offset="0.5" stop-color="#4F5BFF"/>
      <stop offset="1" stop-color="#0A4DDB"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.08" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="200" x2="0" y2="830" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#D6E0FF"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#06133F" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#glow)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="229" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <g filter="url(#shadow)" fill="none" stroke="url(#mark)" stroke-width="104" stroke-linecap="round" stroke-linejoin="round">
    <!-- κ stem -->
    <path d="M356 232V742"/>
    <!-- upper arm -->
    <path d="M356 560L668 244"/>
    <!-- lower leg turned into a downward arrow -->
    <path d="M440 480L668 708"/>
    <path d="M668 520V708H480"/>
  </g>
</svg>
